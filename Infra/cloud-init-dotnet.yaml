#cloud-config
package_update: true

runcmd:
  # install .net runtime 9.0
  - add-apt-repository ppa:dotnet/backports
  - apt-get update
  - apt-get install -y aspnetcore-runtime-9.0

  # create the port /opt/Lego_Inventory directory
  - mkdir -p /opt/BarbellaInventory
  - chown azureuser:azureuser /opt/BarbellaInventory
  
  
  

# Create a service for the application
write_files:
  - path: /etc/systemd/system/BarbellaInventory.service
    content: |
      [Unit]
      Description=ASP.NET Web App running on Ubuntu
      

      [Service]
      WorkingDirectory=/opt/BarbellaInventory
      ExecStart=/usr/bin/dotnet /opt/BarbellaInventory/BarbellaInventory.dll
      Restart=always
      RestartSec=10
      KillSignal=SIGINT
      SyslogIdentifier=BarbellaInventory
      User=www-data
      EnvironmentFile=/etc/BarbellaInventory/.env

      [Install]
      WantedBy=multi-user.target      
    owner: root:root
    permissions: '0644'
    
    #create a directory for the environment file
  - path: /etc/BarbellaInventory/.env
    content: |
      ASPNETCORE_ENVIRONMENT=Production
      ASPNETCORE_URLS=http://+:5000
    owner: www-data:www-data
    permissions: '0640'

systemd:
  units:
    - name: BarbellaInventory.service
      enabled: true