# This workflow will build the barbella inventory project

name: Barbella_InventoryCI/CD_pineline

on:
  push:
    branches:
      - "dev"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Restore dependencies (install Nuget packages)
        run: dotnet restore

      - name: Build and publish the app
        run: |
          dotnet build --no-restore
          dotnet publish -c Release -o ./publish

      - name: Upload app artifacts to Github
        uses: actions/upload-artifact@v4
        with:
          name: app-artifacts
          path: ./publish

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Download the artifacts from Github (from the build job)
        uses: actions/download-artifact@v4
        with:
          name: app-artifacts

      - name: Stop the application service
        run: |
          sudo systemctl stop BarbellaInventory.service

      - name: Deploy the the application
        run: |
          sudo rm -Rf /opt/BarbellaInventory || true
          sudo cp -r /home/azureuser/actions-runner/_work/BarbellaInventory/BarbellaInventory/ /opt/BarbellaInventory

      - name: Start the application service
        run: |
          sudo systemctl start BarbellaInventory.service

  connect-to-cosmos:
    runs-on: ubuntu-latest
    needs: deploy # make sure this job runs only after deploy success
    steps:
      - name: Update CosmosDB connection on VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            hostname
            echo "✅ Successfully connected to VM!"
            echo "COSMOSDB_CONNECTIONSTRING=\"${{ secrets.COSMOSDB_CONNECTIONSTRING }}\"" | sudo tee /etc/BarbellaInventory/.env
            sudo systemctl restart BarbellaInventory.service
      - name: Update environment file with Cosmos DB connection string
        env:
          COSMOSDB_CONNECTIONSTRING: ${{ secrets.COSMOSDB_CONNECTIONSTRING }}
        run: |
          sudo mkdir -p /etc/BarbellaInventory
          sudo bash -c "tee /etc/BarbellaInventory/.env > /dev/null <<EOL
          ASPNETCORE_ENVIRONMENT=Production
          ASPNETCORE_URLS=http://+:5000
          COSMOSDB_DATABASE=\"BarbiesInventory\"
          COSMOSDB_CONNECTIONSTRING=\"${{ secrets.COSMOSDB_CONNECTIONSTRING }}\"
          EOL"
          sudo chown www-data:www-data /etc/BarbellaInventory/.env
          sudo chmod 640 /etc/BarbellaInventory/.env
          sudo systemctl daemon-reexec
          sudo systemctl restart BarbellaInventory.service
          sudo systemctl status BarbellaInventory.service

      
